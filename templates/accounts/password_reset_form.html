
{% extends 'base.html' %}

{% block content %}
<section class="ftco-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3>Forgot Password?</h3>
                        <p>
                            Enter the email address associated with
                            your account. We'll send you a reset link
                            if an eligible account exists.
                        </p>

                        <form method="post">
                            {% csrf_token %}

                            <div class="form-group">
                                <label for="id_email">
                                    Email address
                                </label>
                                <input
                                    type="email"
                                    name="email"
                                    id="id_email"
                                    class="form-control"
                                    required
                                    autocomplete="email"
                                >
                                {% if form.email.errors %}
                                    <div class="text-danger">
                                        {{ form.email.errors }}
                                    </div>
                                {% endif %}
                            </div>

                            <button type="submit"
                                    class="btn btn-primary btn-block">
                                Send Reset Link
                            </button>
                        </form>

                        <p class="mt-3 mb-0 text-center">
                            <a href="{% url 'accounts:login' %}">
                                Back to Login
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
